# Re-read on each invocation; CLI options override this file.
# Variables: load (Slurm CPULoad), cpus, weight (current Slurm weight), history (smoothed score).
# Operators: + - * / ( ); result is clamped, then truncated to an integer.
# Use an absolute path for a custom Slurm installation, e.g. /opt/slurm/bin/scontrol.
scontrol_path = scontrol
state_file = /var/lib/abhpc-lbs/history
history_fast_minutes = 30
history_slow_minutes = 80
formula = history
min_weight = 0
max_weight = 100
